{% extends "accounts/auth_base.html" %}
{% block title %}Change password | Smart Invoice{% endblock %}
{% block auth_body %}
<h1 id="auth-heading">Change your password</h1>
<p class="auth-subtitle">Enter your current password, then choose a new one.</p>
<form method="post" data-auth-form>{% csrf_token %}{% include "accounts/_auth_fields.html" %}<button class="auth-primary" type="submit" data-busy-text="Updating password…">Change password</button></form>
<p class="auth-back"><a href="{% url 'profile' %}"><span aria-hidden="true">← </span>Back to settings</a></p>
{% endblock %}
