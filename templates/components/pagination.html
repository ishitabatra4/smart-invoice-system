{% load workspace_ui %}{% pagination_query as query %}
{% if page.paginator.num_pages > 1 %}<nav class="workspace-pagination" aria-label="Results pages"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} results</span><div>{% if page.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{{ query }}&amp;page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{{ query }}&amp;page={{ page.next_page_number }}">Next</a>{% endif %}</div></nav>{% endif %}
